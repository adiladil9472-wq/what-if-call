<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What If I Call ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 20%, #59416f, transparent 50%),
    linear-gradient(135deg, #080811, #24152e, #080811);
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 600px;
  padding: 25px;
}

h1 {
  font-size: 24px;
  letter-spacing: 4px;
  color: #e6ceff;
}

.subtitle {
  color: #b9a7ca;
  font-size: 13px;
  letter-spacing: 2px;
}

#lyric {
  min-height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  line-height: 1.6;
  font-weight: bold;
  text-shadow: 0 0 20px #cda5ff;
  transition: opacity 0.7s ease;
}

.fade {
  opacity: 0;
}

button {
  padding: 13px 27px;
  border: 1px solid #d7b8ff;
  border-radius: 30px;
  background: #d7b8ff;
  color: #20152c;
  font-size: 15px;
  cursor: pointer;
}

.footer {
  margin-top: 30px;
  color: #b9a7ca;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="card">
  <p class="subtitle">A LITTLE PIECE OF MUSIC</p>
  <h1>WHAT IF I CALL</h1>
  <div id="lyric"></div>
  <button id="play">▶️ Mulai Lirik</button>

</div>

<script>
  const lyricText = "Aku ingin menyampaikan sesuatu untukmu...";
const lyricElement = document.getElementById("lyric");

let i = 0;

function typeLyric() {
  if (i < lyricText.length) {
    lyricElement.textContent += lyricText.charAt(i);
    i++;
    setTimeout(typeLyric, 100);
  }
const lines = [
  ["You Know It's true", 4000],
  ["yeah i miss you", 4000],
  ["You Know It's true", 4000],
  ["SO, What if i call", 4000],
  ["And you pick up the phone", 4000],
  ["And i use holiday", 3000],
  ["To make my way to your ghost", 5000],
  ["Oh, what if you're lonely?", 4000],
  ["You know i am too", 3000],
  ["And i get the chance to say", 3000],
  ["Merry Chrismast i miss you", 5000]
  ["i miss you", 3000]
];

const lyric = document.getElementById("lyric");
const play = document.getElementById("play");

let index = 0;
let timer;

function showLine() {
  lyric.classList.add("fade");

  timer = setTimeout(() => {
    if (lines[index][0] === "end") {
      lyric.textContent = "Thank you for listening ♡";
      lyric.classList.remove("fade");
      play.disabled = false;
      play.textContent = "↻ Ulangi";
      return;
    }

    lyric.textContent = lines[index][0];
    lyric.classList.remove("fade");

    const delay = lines[index][1];
    index++;

    timer = setTimeout(showLine, delay);
  }, 700);
}

play.addEventListener("click", () => {
  clearTimeout(timer);
  index = 0;
  play.disabled = true;
  play.textContent = "Lirik berjalan...";
  showLine();
});
</script>
</body>
</html>
